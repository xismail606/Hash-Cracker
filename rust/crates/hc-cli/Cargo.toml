[package]
name = "hc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hash Cracker command line interface (parity twin of the Python hashcrack CLI)"

[[bin]]
name = "hashcrack-rs"
path = "src/main.rs"

[dependencies]
hc-core = { workspace = true }
hc-history = { workspace = true }
hc-server = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
ctrlc = "3"
rpassword = "7"
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
