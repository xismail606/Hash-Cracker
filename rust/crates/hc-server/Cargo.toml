[package]
name = "hc-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hash Cracker local dashboard server (REST contract twin of the Flask app)"

[lib]
name = "hc_server"
path = "src/lib.rs"

[[bin]]
name = "hc-server"
path = "src/main.rs"

[dependencies]
hc-core = { workspace = true }
hc-history = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
time = { workspace = true }

tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
http-body-util = "0.1"
