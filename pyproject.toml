[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "password-audit"
version = "0.1.0"
description = "Offline hash identification and password auditing tool with a CLI and local web dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [{ name = "Hash Cracker project" }]
dependencies = [
    "Flask>=3.0",
    "passlib>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
encrypt = [
    "cryptography>=42",
]
adaptive = [
    "bcrypt>=3.2,<4.1",
]

[project.scripts]
password-audit = "password_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
password_audit = ["static/**/*"]
