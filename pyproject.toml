[build-system]

requires = ["setuptools>=77"]

build-backend = "setuptools.build_meta"



[project]

name = "password-audit"

version = "3.1.0"

description = "Offline hash identification and password auditing tool with a CLI and local web dashboard"

readme = "README.md"

requires-python = ">=3.11"

license = "MIT"

license-files = ["LICENSE.md"]

authors = [{ name = "Hash Cracker project" }]

dependencies = [

    "Flask>=3.0",

    "passlib>=1.7.4",

]



[project.optional-dependencies]

dev = [

    "pytest>=8.0",

    "pytest-cov>=5.0",

    "mypy>=1.13",

    "types-passlib>=1.7",

]

encrypt = [

    "cryptography>=42",

]

adaptive = [

    "bcrypt>=3.2,<4.1",

]



[project.scripts]

hashcrack = "hash_cracker.cli:main"



[tool.setuptools.packages.find]

where = ["src"]



[tool.setuptools.package-data]

hash_cracker = ["static/**/*"]



[tool.ruff]

line-length = 100

target-version = "py311"



[tool.ruff.lint]

select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

ignore = [

    # Deliberate: Passlib import chains and the CLI serve loop can raise

    # anything; the code intentionally converts every failure to a clean

    # error/fallback, so a broad except is the designed behavior.

    "BLE001",

    # Deliberate: dictionary streaming keeps one file handle open across

    # yielded batches; a context manager would close it mid-stream.

    "SIM115",

]



[tool.coverage.run]

source = ["src/hash_cracker"]

omit = ["src/hash_cracker/__main__.py"]



[tool.coverage.report]

# Guards against coverage regressions; raise as the suite grows.

fail_under = 75

skip_covered = true



[tool.mypy]

python_version = "3.11"

files = ["src/hash_cracker"]

# The web layer is largely closures over Flask state; still check their bodies.

check_untyped_defs = true

warn_unused_ignores = true

no_implicit_optional = true

